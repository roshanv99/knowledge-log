# Local Postgres for knowledge-log. Port 5434 avoids SRG (5433) and Wardrobe Log (5432).
name: knowledge-log

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kl}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_log}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
