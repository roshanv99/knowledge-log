# Local Postgres for knowledge-log. Port 5434 avoids SRG (5433) and Wardrobe Log (5432).
#
# Deliberately a different compose project name than the root docker-compose.yml
# (production shape). Both once used `name: knowledge-log` + a `pgdata:` volume, which
# Compose resolves to the identical volume name `knowledge-log_pgdata` — a `down -v` while
# testing the production compose files silently deleted this local dev database. Never let
# these collide again.
name: knowledge-log-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kl}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_log}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
