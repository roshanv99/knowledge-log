## oauth2-proxy — Google OIDC only (secrets come from deploy/oauth2-proxy.env)

provider = "google"
http_address = "0.0.0.0:4180"
reverse_proxy = true
skip_provider_button = true
scope = "openid email profile"
set_xauthrequest = true

# Public health check (no Google login required) — matches nginx's own /api/health bypass.
skip_auth_routes = [ "GET=^/api/health$" ]

upstreams = [ "static://202" ]
