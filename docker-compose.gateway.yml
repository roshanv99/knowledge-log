# Docker + Google SSO, fronted by the home server's cloudflared tunnel or, for local testing,
# run directly. See deploy/HOMESERVER.md.
#
#   cp deploy/env.example .env
#   cp deploy/oauth2-proxy.env.example deploy/oauth2-proxy.env
#   # fill in .env and deploy/oauth2-proxy.env
#   docker network create gateway   # once, if not already created by the gateway repo
#   docker compose -f docker-compose.yml -f docker-compose.gateway.yml up -d --build   # local
#   docker compose -f docker-compose.yml -f docker-compose.gateway.yml up -d           # production (pulls from GHCR)

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    networks: [edge, internal]
    env_file:
      - ./deploy/oauth2-proxy.env
    volumes:
      - ./deploy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    command: --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    restart: unless-stopped

  nginx:
    build:
      context: ./ui
    image: ${KL_UI_IMAGE:-ghcr.io/roshanv99/knowledge-log-ui:latest}
    networks:
      edge:
      internal:
      # Shared with the home server's cloudflared (roshanv99/home-server). The alias is what
      # the tunnel route targets (http://knowledgelog:80), so it stays stable no matter what
      # compose names this container.
      gateway:
        aliases:
          - knowledgelog
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      oauth2-proxy:
        condition: service_started
      knowledge-log-backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Created once on the host with `docker network create gateway` (home-server's setup.sh),
  # shared by every app and the cloudflared edge. Declared external so no single project
  # owns its lifecycle.
  gateway:
    external: true
    name: gateway
